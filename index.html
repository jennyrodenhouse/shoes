<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated 3D Shoes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #ffffff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #333333;
            z-index: 10;
            background: rgba(240, 240, 240, 0.9);
            padding: 20px 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 2px solid #dddddd;
        }

        #info h1 {
            margin-bottom: 15px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #info p {
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        #command-input {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        #action-input {
            width: 400px;
            padding: 15px 20px;
            font-size: 1.2em;
            border: 3px solid #333333;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.9);
            outline: none;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        #action-input:focus {
            background: white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            transform: scale(1.05);
        }

        #current-action {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4em;
            color: #333333;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            font-weight: bold;
            z-index: 5;
        }

        #current-action.show {
            opacity: 0.8;
        }

        .command-badge {
            display: inline-block;
            background: rgba(0, 0, 0, 0.1);
            padding: 5px 15px;
            margin: 5px;
            border-radius: 15px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="info">
        <h1>🎮 Animated 3D Shoes</h1>
        <p>Type an action below and press Enter!</p>
        <div>
            <span class="command-badge">walk</span>
            <span class="command-badge">run</span>
            <span class="command-badge">jump</span>
            <span class="command-badge">dance</span>
            <span class="command-badge">stop</span>
        </div>
    </div>

    <div id="command-input">
        <input type="text" id="action-input" placeholder="Type: walk, run, jump, dance..." />
    </div>

    <div id="current-action"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const pointLight1 = new THREE.PointLight(0xff00ff, 0.5, 50);
        pointLight1.position.set(-5, 3, 5);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0x00ffff, 0.5, 50);
        pointLight2.position.set(5, 3, 5);
        scene.add(pointLight2);

        // Create Shoe function
        function createShoe(color, positionX) {
            const shoe = new THREE.Group();

            // Sole (bottom of shoe)
            const soleGeometry = new THREE.BoxGeometry(1, 0.3, 2);
            const soleMaterial = new THREE.MeshStandardMaterial({
                color: 0x333333,
                roughness: 0.7,
                metalness: 0.3
            });
            const sole = new THREE.Mesh(soleGeometry, soleMaterial);
            sole.position.y = 0.15;
            sole.castShadow = true;
            shoe.add(sole);

            // Toe cap (rounded front)
            const toeGeometry = new THREE.SphereGeometry(0.5, 32, 32, 0, Math.PI * 2, 0, Math.PI / 2);
            const toeMaterial = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.4,
                metalness: 0.6
            });
            const toe = new THREE.Mesh(toeGeometry, toeMaterial);
            toe.position.set(0, 0.5, 0.6);
            toe.rotation.x = Math.PI / 2;
            toe.castShadow = true;
            shoe.add(toe);

            // Upper body of shoe
            const upperGeometry = new THREE.BoxGeometry(1, 0.8, 1.5);
            const upperMaterial = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.4,
                metalness: 0.6
            });
            const upper = new THREE.Mesh(upperGeometry, upperMaterial);
            upper.position.set(0, 0.7, -0.2);
            upper.castShadow = true;
            shoe.add(upper);

            // Heel (back part)
            const heelGeometry = new THREE.BoxGeometry(1, 1.2, 0.6);
            const heelMaterial = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.4,
                metalness: 0.6
            });
            const heel = new THREE.Mesh(heelGeometry, heelMaterial);
            heel.position.set(0, 0.9, -0.8);
            heel.castShadow = true;
            shoe.add(heel);

            // Laces decoration
            for (let i = 0; i < 3; i++) {
                const laceGeometry = new THREE.CylinderGeometry(0.05, 0.05, 0.8, 8);
                const laceMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff });
                const lace = new THREE.Mesh(laceGeometry, laceMaterial);
                lace.position.set(0, 0.8 + i * 0.2, 0.2 - i * 0.2);
                lace.rotation.z = Math.PI / 2;
                shoe.add(lace);
            }

            shoe.position.x = positionX;
            shoe.position.y = 1;

            return shoe;
        }

        // Create left and right shoes
        const leftShoe = createShoe(0xff3366, -1.2);
        const rightShoe = createShoe(0x3366ff, 1.2);

        scene.add(leftShoe);
        scene.add(rightShoe);

        // Ground plane (invisible but helps with depth perception)
        const groundGeometry = new THREE.CircleGeometry(10, 32);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0xf5f5f5,
            roughness: 0.8,
            opacity: 0.5,
            transparent: true
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        ground.receiveShadow = true;
        scene.add(ground);

        // Animation state
        let currentAnimation = 'idle';
        let animationTime = 0;
        let animationSpeed = 1;

        // Animation functions
        function animateIdle(time) {
            const float = Math.sin(time * 2) * 0.1;
            leftShoe.position.y = 1 + float;
            rightShoe.position.y = 1 + float;
        }

        function animateWalk(time) {
            const speed = 2;
            const stepHeight = 0.5;
            const stepLength = 0.3;

            leftShoe.position.y = 1 + Math.abs(Math.sin(time * speed)) * stepHeight;
            rightShoe.position.y = 1 + Math.abs(Math.sin(time * speed + Math.PI)) * stepHeight;

            leftShoe.position.z = Math.sin(time * speed) * stepLength;
            rightShoe.position.z = Math.sin(time * speed + Math.PI) * stepLength;

            leftShoe.rotation.x = Math.sin(time * speed) * 0.3;
            rightShoe.rotation.x = Math.sin(time * speed + Math.PI) * 0.3;
        }

        function animateRun(time) {
            const speed = 4;
            const stepHeight = 0.8;
            const stepLength = 0.5;

            leftShoe.position.y = 1 + Math.abs(Math.sin(time * speed)) * stepHeight;
            rightShoe.position.y = 1 + Math.abs(Math.sin(time * speed + Math.PI)) * stepHeight;

            leftShoe.position.z = Math.sin(time * speed) * stepLength;
            rightShoe.position.z = Math.sin(time * speed + Math.PI) * stepLength;

            leftShoe.rotation.x = Math.sin(time * speed) * 0.5;
            rightShoe.rotation.x = Math.sin(time * speed + Math.PI) * 0.5;

            // Add some dynamic tilt
            leftShoe.rotation.z = Math.sin(time * speed) * 0.2;
            rightShoe.rotation.z = Math.sin(time * speed + Math.PI) * 0.2;
        }

        function animateJump(time) {
            const jumpHeight = 2.5;
            const jumpTime = time % 2;

            let height = 1;
            if (jumpTime < 1) {
                height = 1 + Math.sin(jumpTime * Math.PI) * jumpHeight;
            }

            leftShoe.position.y = height;
            rightShoe.position.y = height;

            // Point toes down when in air
            if (jumpTime < 1 && jumpTime > 0.2) {
                leftShoe.rotation.x = -0.5;
                rightShoe.rotation.x = -0.5;
            } else {
                leftShoe.rotation.x = 0;
                rightShoe.rotation.x = 0;
            }
        }

        function animateDance(time) {
            const speed = 3;

            // Complex dance movement
            leftShoe.position.y = 1 + Math.abs(Math.sin(time * speed)) * 0.5;
            rightShoe.position.y = 1 + Math.abs(Math.cos(time * speed)) * 0.5;

            leftShoe.position.x = -1.2 + Math.sin(time * speed * 0.5) * 0.3;
            rightShoe.position.x = 1.2 + Math.cos(time * speed * 0.5) * 0.3;

            leftShoe.rotation.y = Math.sin(time * speed) * 0.5;
            rightShoe.rotation.y = Math.cos(time * speed) * 0.5;

            leftShoe.rotation.z = Math.sin(time * speed * 2) * 0.3;
            rightShoe.rotation.z = Math.cos(time * speed * 2) * 0.3;
        }

        // Handle input
        const actionInput = document.getElementById('action-input');
        const currentActionDiv = document.getElementById('current-action');

        actionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const action = actionInput.value.toLowerCase().trim();
                actionInput.value = '';

                if (['walk', 'run', 'jump', 'dance', 'stop', 'idle'].includes(action)) {
                    currentAnimation = action === 'stop' ? 'idle' : action;

                    // Show action name
                    currentActionDiv.textContent = action.toUpperCase();
                    currentActionDiv.classList.add('show');

                    setTimeout(() => {
                        currentActionDiv.classList.remove('show');
                    }, 1500);

                    // Reset positions and rotations
                    animationTime = 0;
                }
            }
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            animationTime += 0.016; // ~60fps

            // Reset rotations each frame
            leftShoe.rotation.x = 0;
            leftShoe.rotation.y = 0;
            leftShoe.rotation.z = 0;
            rightShoe.rotation.x = 0;
            rightShoe.rotation.y = 0;
            rightShoe.rotation.z = 0;

            // Apply current animation
            switch(currentAnimation) {
                case 'walk':
                    animateWalk(animationTime);
                    break;
                case 'run':
                    animateRun(animationTime);
                    break;
                case 'jump':
                    animateJump(animationTime);
                    break;
                case 'dance':
                    animateDance(animationTime);
                    break;
                default:
                    animateIdle(animationTime);
            }

            // Rotate lights for dynamic effect
            pointLight1.position.x = Math.sin(animationTime * 0.5) * 5;
            pointLight1.position.z = Math.cos(animationTime * 0.5) * 5;
            pointLight2.position.x = Math.cos(animationTime * 0.5) * 5;
            pointLight2.position.z = Math.sin(animationTime * 0.5) * 5;

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start animation
        animate();

        // Focus input on load
        window.addEventListener('load', () => {
            actionInput.focus();
        });
    </script>
</body>
</html>
