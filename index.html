<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #player-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
            cursor: pointer;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Bottom controls bar */
        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 60px 20px 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.75));
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: opacity 0.3s;
        }

        #controls.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Seekbar */
        #seekbar-track {
            position: relative;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            cursor: pointer;
            transition: height 0.15s;
        }

        #seekbar-track:hover,
        #seekbar-track.active {
            height: 6px;
        }

        #seekbar-fill {
            height: 100%;
            background: #fff;
            border-radius: 2px;
            width: 0%;
            pointer-events: none;
        }

        #seekbar-thumb {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            transition: transform 0.15s;
            left: 0%;
        }

        #seekbar-track:hover #seekbar-thumb,
        #seekbar-track.active #seekbar-thumb {
            transform: translate(-50%, -50%) scale(1);
        }

        /* Bottom row: play button + time + speed */
        #bottom-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        #play-btn {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #play-btn svg {
            fill: white;
            width: 28px;
            height: 28px;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
        }

        #time-display {
            color: rgba(255,255,255,0.85);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        #speed-badge {
            margin-left: auto;
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 12px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.02em;
            transition: background 0.2s, opacity 0.3s;
            opacity: 0;
        }

        #speed-badge.visible {
            opacity: 1;
        }

        /* Center play/pause overlay flash */
        #center-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            width: 72px;
            height: 72px;
            background: rgba(0,0,0,0.55);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: none;
        }

        #center-icon svg {
            fill: white;
            width: 36px;
            height: 36px;
        }

        #center-icon.flash {
            animation: iconFlash 0.45s ease-out forwards;
        }

        @keyframes iconFlash {
            0%   { opacity: 1; transform: translate(-50%,-50%) scale(0.85); }
            40%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%,-50%) scale(1.1); }
        }

        /* Gesture feedback toast */
        #gesture-toast {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.65);
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        #gesture-toast.show {
            opacity: 1;
        }

        /* Seek delta overlay (shown during drag/scroll) */
        #seek-delta {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s;
            text-align: center;
        }

        #seek-delta.show {
            opacity: 1;
        }

        #seek-delta .delta-time {
            font-size: 36px;
            display: block;
        }

        #seek-delta .delta-label {
            font-size: 13px;
            font-weight: 400;
            opacity: 0.75;
            display: block;
        }

        /* Speed overlay (shown during pinch) */
        #speed-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s;
            text-align: center;
        }

        #speed-overlay.show {
            opacity: 1;
        }

        #speed-overlay .speed-value {
            font-size: 40px;
            display: block;
        }

        #speed-overlay .speed-label {
            font-size: 13px;
            font-weight: 400;
            opacity: 0.75;
            display: block;
        }

        /* Hint overlay shown on first load */
        #hints {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: opacity 0.6s;
        }

        #hints.hidden {
            opacity: 0;
        }

        #hints-inner {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 32px;
            background: rgba(0,0,0,0.6);
            border-radius: 16px;
            padding: 28px 36px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .hint-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255,255,255,0.9);
        }

        .hint-icon {
            font-size: 26px;
            width: 36px;
            text-align: center;
            flex-shrink: 0;
        }

        .hint-text strong {
            display: block;
            font-size: 14px;
            font-weight: 600;
        }

        .hint-text span {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
        }
    </style>
</head>
<body>
<div id="player-wrapper">
    <video id="video" preload="metadata" playsinline>
        <source src="IxDGradShowSetup.mp4" type="video/mp4">
    </video>

    <!-- Gesture hints overlay -->
    <div id="hints">
        <div id="hints-inner">
            <div class="hint-item">
                <div class="hint-icon">👆</div>
                <div class="hint-text">
                    <strong>Tap</strong>
                    <span>Play / Pause</span>
                </div>
            </div>
            <div class="hint-item">
                <div class="hint-icon">↔️</div>
                <div class="hint-text">
                    <strong>Drag</strong>
                    <span>Scrub timeline</span>
                </div>
            </div>
            <div class="hint-item">
                <div class="hint-icon">🖱️</div>
                <div class="hint-text">
                    <strong>Scroll</strong>
                    <span>Scrub timeline</span>
                </div>
            </div>
            <div class="hint-item">
                <div class="hint-icon">🤌</div>
                <div class="hint-text">
                    <strong>Pinch / Stretch</strong>
                    <span>Playback speed</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Seek delta display -->
    <div id="seek-delta">
        <span class="delta-time"></span>
        <span class="delta-label">scrubbing</span>
    </div>

    <!-- Speed overlay -->
    <div id="speed-overlay">
        <span class="speed-value"></span>
        <span class="speed-label">playback speed</span>
    </div>

    <!-- Center flash icon -->
    <div id="center-icon">
        <svg id="center-svg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>

    <!-- Gesture toast -->
    <div id="gesture-toast"></div>

    <!-- Controls -->
    <div id="controls">
        <div id="seekbar-track">
            <div id="seekbar-fill"></div>
            <div id="seekbar-thumb"></div>
        </div>
        <div id="bottom-row">
            <button id="play-btn" aria-label="Play">
                <svg id="play-svg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <span id="time-display">0:00 / 0:00</span>
            <span id="speed-badge">1.0×</span>
        </div>
    </div>
</div>

<script>
    const video       = document.getElementById('video');
    const controls    = document.getElementById('controls');
    const playSvg     = document.getElementById('play-svg');
    const centerIcon  = document.getElementById('center-icon');
    const centerSvg   = document.getElementById('center-svg');
    const timeDisplay = document.getElementById('time-display');
    const seekTrack   = document.getElementById('seekbar-track');
    const seekFill    = document.getElementById('seekbar-fill');
    const seekThumb   = document.getElementById('seekbar-thumb');
    const speedBadge  = document.getElementById('speed-badge');
    const seekDelta   = document.getElementById('seek-delta');
    const seekDeltaTime  = seekDelta.querySelector('.delta-time');
    const speedOverlay   = document.getElementById('speed-overlay');
    const speedValue     = speedOverlay.querySelector('.speed-value');
    const gestureToast   = document.getElementById('gesture-toast');
    const hints          = document.getElementById('hints');

    // ── SVG paths ─────────────────────────────────────────────────────────────
    const PLAY_PATH  = 'M8 5v14l11-7z';
    const PAUSE_PATH = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';

    // ── Helpers ────────────────────────────────────────────────────────────────
    function formatTime(s) {
        if (isNaN(s)) return '0:00';
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

    // ── Toast ──────────────────────────────────────────────────────────────────
    let toastTimer = null;
    function showToast(msg) {
        gestureToast.textContent = msg;
        gestureToast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => gestureToast.classList.remove('show'), 1200);
    }

    // ── Controls auto-hide ────────────────────────────────────────────────────
    let hideTimer = null;
    function showControls() {
        controls.classList.remove('hidden');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
            if (!video.paused) controls.classList.add('hidden');
        }, 3000);
    }

    // ── Play / Pause ──────────────────────────────────────────────────────────
    function togglePlay() {
        if (video.paused) {
            video.play();
        } else {
            video.pause();
        }
    }

    function flashCenterIcon(playing) {
        centerSvg.querySelector('path').setAttribute('d', playing ? PAUSE_PATH : PLAY_PATH);
        centerIcon.classList.remove('flash');
        void centerIcon.offsetWidth; // reflow
        centerIcon.classList.add('flash');
    }

    video.addEventListener('play', () => {
        playSvg.querySelector('path').setAttribute('d', PAUSE_PATH);
        showControls();
    });

    video.addEventListener('pause', () => {
        playSvg.querySelector('path').setAttribute('d', PLAY_PATH);
        controls.classList.remove('hidden');
        clearTimeout(hideTimer);
    });

    document.getElementById('play-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        togglePlay();
    });

    // ── Timeline / Seekbar ────────────────────────────────────────────────────
    function updateSeekbar() {
        if (!video.duration) return;
        const pct = (video.currentTime / video.duration) * 100;
        seekFill.style.width = pct + '%';
        seekThumb.style.left = pct + '%';
        timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
    }

    video.addEventListener('timeupdate', updateSeekbar);
    video.addEventListener('loadedmetadata', updateSeekbar);

    // Click on seekbar to seek
    seekTrack.addEventListener('click', (e) => {
        e.stopPropagation();
        const rect = seekTrack.getBoundingClientRect();
        const pct = clamp((e.clientX - rect.left) / rect.width, 0, 1);
        video.currentTime = pct * video.duration;
        showToast('Seeked to ' + formatTime(video.currentTime));
    });

    // Drag seekbar
    let seekbarDragging = false;
    seekTrack.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        seekbarDragging = true;
        seekTrack.classList.add('active');
    });
    window.addEventListener('mousemove', (e) => {
        if (!seekbarDragging) return;
        const rect = seekTrack.getBoundingClientRect();
        const pct = clamp((e.clientX - rect.left) / rect.width, 0, 1);
        video.currentTime = pct * video.duration;
    });
    window.addEventListener('mouseup', () => {
        if (seekbarDragging) {
            seekbarDragging = false;
            seekTrack.classList.remove('active');
        }
    });

    // ── Speed badge ───────────────────────────────────────────────────────────
    function updateSpeedBadge() {
        const r = video.playbackRate;
        const label = r.toFixed(r % 1 === 0 ? 0 : 1) + '×';
        speedBadge.textContent = label;
        speedBadge.classList.toggle('visible', r !== 1);
    }
    updateSpeedBadge();

    // ── Hints dismissal ───────────────────────────────────────────────────────
    let hintsDismissed = false;
    function dismissHints() {
        if (!hintsDismissed) {
            hintsDismissed = true;
            hints.classList.add('hidden');
        }
    }

    // ── Scroll to scrub ───────────────────────────────────────────────────────
    let scrollSeekTimer = null;
    window.addEventListener('wheel', (e) => {
        e.preventDefault();
        dismissHints();
        showControls();

        // Normalize delta: positive = forward, negative = backward
        // Typically deltaY: positive = scroll down = go back; negate for intuitive fwd scroll
        const delta = -e.deltaY * 0.05;
        const newTime = clamp(video.currentTime + delta, 0, video.duration || 0);
        video.currentTime = newTime;

        const sign = delta >= 0 ? '+' : '';
        seekDeltaTime.textContent = sign + delta.toFixed(1) + 's';
        seekDelta.classList.add('show');
        clearTimeout(scrollSeekTimer);
        scrollSeekTimer = setTimeout(() => seekDelta.classList.remove('show'), 600);

        showToast('Scroll  ' + (delta >= 0 ? '▶' : '◀') + '  ' + formatTime(newTime));
    }, { passive: false });

    // ── Touch gesture state ───────────────────────────────────────────────────
    let touchState = 'idle'; // idle | tap-pending | dragging | pinching
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartWallTime = 0;
    let dragBaseTime = 0;    // video.currentTime at drag start

    let pinchStartDist = 0;
    let pinchBaseSpeed = 1;

    let dragSeekTimer = null;

    const TAP_MAX_DIST = 12;
    const TAP_MAX_MS   = 280;
    const DRAG_MIN_DIST = 8;

    // Pixels per second of video scrub during drag
    const SCRUB_SENSITIVITY = 0.15; // seconds per pixel

    function getTouchDist(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.hypot(dx, dy);
    }

    document.getElementById('player-wrapper').addEventListener('touchstart', (e) => {
        dismissHints();
        showControls();

        if (e.touches.length === 1) {
            touchState = 'tap-pending';
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchStartWallTime = Date.now();
            dragBaseTime = video.currentTime;
        } else if (e.touches.length === 2) {
            touchState = 'pinching';
            pinchStartDist = getTouchDist(e.touches);
            pinchBaseSpeed = video.playbackRate;
            speedOverlay.classList.add('show');
        }
    }, { passive: true });

    document.getElementById('player-wrapper').addEventListener('touchmove', (e) => {
        e.preventDefault();

        if (touchState === 'pinching' && e.touches.length === 2) {
            const dist = getTouchDist(e.touches);
            const ratio = dist / pinchStartDist;
            // Scale speed: stretch = faster, pinch = slower. Clamp 0.25x–4x
            const newSpeed = clamp(pinchBaseSpeed * ratio, 0.25, 4);
            video.playbackRate = newSpeed;
            updateSpeedBadge();

            const label = newSpeed.toFixed(1) + '×';
            speedValue.textContent = label;
        }

        if ((touchState === 'tap-pending' || touchState === 'dragging') && e.touches.length === 1) {
            const dx = e.touches[0].clientX - touchStartX;
            const dy = e.touches[0].clientY - touchStartY;

            if (touchState === 'tap-pending' && Math.abs(dx) > DRAG_MIN_DIST) {
                touchState = 'dragging';
                seekDelta.classList.add('show');
            }

            if (touchState === 'dragging') {
                const delta = dx * SCRUB_SENSITIVITY;
                const newTime = clamp(dragBaseTime + delta, 0, video.duration || 0);
                video.currentTime = newTime;

                const sign = delta >= 0 ? '+' : '';
                seekDeltaTime.textContent = sign + delta.toFixed(1) + 's';

                clearTimeout(dragSeekTimer);
            }
        }
    }, { passive: false });

    document.getElementById('player-wrapper').addEventListener('touchend', (e) => {
        if (touchState === 'tap-pending') {
            const elapsed = Date.now() - touchStartWallTime;
            const dx = (e.changedTouches[0]?.clientX ?? touchStartX) - touchStartX;
            const dy = (e.changedTouches[0]?.clientY ?? touchStartY) - touchStartY;
            const dist = Math.hypot(dx, dy);

            if (dist < TAP_MAX_DIST && elapsed < TAP_MAX_MS) {
                const wasPlaying = !video.paused;
                togglePlay();
                flashCenterIcon(wasPlaying);
                showToast(wasPlaying ? '⏸ Paused' : '▶ Playing');
            }
        }

        if (touchState === 'dragging') {
            dragSeekTimer = setTimeout(() => seekDelta.classList.remove('show'), 600);
            showToast('Seeked to ' + formatTime(video.currentTime));
        }

        if (touchState === 'pinching' || e.touches.length < 2) {
            if (touchState === 'pinching') {
                speedOverlay.classList.remove('show');
                showToast('Speed: ' + video.playbackRate.toFixed(1) + '×');
            }
        }

        if (e.touches.length === 0) {
            touchState = 'idle';
        }
    }, { passive: true });

    // ── Mouse drag to scrub (desktop) ─────────────────────────────────────────
    let mouseDragActive = false;
    let mouseDragBaseX = 0;
    let mouseDragBaseTime = 0;
    let mouseMoved = false;

    document.getElementById('player-wrapper').addEventListener('mousedown', (e) => {
        if (e.target === seekTrack || seekTrack.contains(e.target)) return;
        dismissHints();
        mouseDragActive = true;
        mouseDragBaseX = e.clientX;
        mouseDragBaseTime = video.currentTime;
        mouseMoved = false;
        showControls();
    });

    window.addEventListener('mousemove', (e) => {
        if (!mouseDragActive) return;
        const dx = e.clientX - mouseDragBaseX;
        if (Math.abs(dx) > DRAG_MIN_DIST) {
            mouseMoved = true;
            const delta = dx * SCRUB_SENSITIVITY;
            const newTime = clamp(mouseDragBaseTime + delta, 0, video.duration || 0);
            video.currentTime = newTime;

            const sign = delta >= 0 ? '+' : '';
            seekDeltaTime.textContent = sign + delta.toFixed(1) + 's';
            seekDelta.classList.add('show');
        }
    });

    window.addEventListener('mouseup', (e) => {
        if (!mouseDragActive) return;
        mouseDragActive = false;

        if (mouseMoved) {
            setTimeout(() => seekDelta.classList.remove('show'), 600);
            showToast('Seeked to ' + formatTime(video.currentTime));
        } else {
            // Was a click, not a drag
            const wasPlaying = !video.paused;
            togglePlay();
            flashCenterIcon(wasPlaying);
            showToast(wasPlaying ? '⏸ Paused' : '▶ Playing');
        }
    });

    // Prevent text selection during drag
    document.getElementById('player-wrapper').addEventListener('dragstart', e => e.preventDefault());

    // ── Keyboard shortcuts ────────────────────────────────────────────────────
    document.addEventListener('keydown', (e) => {
        switch (e.key) {
            case ' ':
            case 'k':
                e.preventDefault();
                const wasPlaying = !video.paused;
                togglePlay();
                flashCenterIcon(wasPlaying);
                showToast(wasPlaying ? '⏸ Paused' : '▶ Playing');
                break;
            case 'ArrowRight':
                video.currentTime = clamp(video.currentTime + 5, 0, video.duration);
                showToast('▶▶ +5s');
                showControls();
                break;
            case 'ArrowLeft':
                video.currentTime = clamp(video.currentTime - 5, 0, video.duration);
                showToast('◀◀ -5s');
                showControls();
                break;
            case '>':
                video.playbackRate = clamp(video.playbackRate + 0.25, 0.25, 4);
                updateSpeedBadge();
                showToast('Speed: ' + video.playbackRate.toFixed(2) + '×');
                break;
            case '<':
                video.playbackRate = clamp(video.playbackRate - 0.25, 0.25, 4);
                updateSpeedBadge();
                showToast('Speed: ' + video.playbackRate.toFixed(2) + '×');
                break;
        }
    });

    // ── Pointer move shows controls ───────────────────────────────────────────
    document.getElementById('player-wrapper').addEventListener('mousemove', () => showControls());

    // ── Initial state ─────────────────────────────────────────────────────────
    showControls();
</script>
</body>
</html>
